<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/queries.css" />
    <title>Patrik's portfolio</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico" />
  </head>
  <body>

    <!---------------- Navigation -------------->
    <section class="navigation">
      <!-- Include header.html in file -->
      <div id="header-placeholder"></div>
    </section>        

    <!---------------- Content -------------->
    <section class="intro-section">
      <div class="container">
        
          <h1 class="premium">Contact</h1>
            <form action="https://formspree.io/f/mnjzbbvn" method="POST" class="contact-form">
              
              <div class="form-div">
                <label for="name" class="label-form">Your name:</label>
                <input type="text" id="name" name="name">
              </div>
              
              <div class="form-div">
                <label for="email" class="label-form">Your email:</label>
                <input type="email" id="email" name="email">
              </div>

              <div class="form-div">
                <label for="message" class="label-form">Message:</label>
                <textarea id="message" name="message" rows="10" cols="50"></textarea>
              </div>

              <div class="form-div-btn">
                <button class="btn">Send</button>
              </div>
               <img
              src="./img/logo.png"
              class="frog-image"
              height="100rem"
              width="100rem"
              alt="Frog"
              align="right"
              
            />
          
        
            </form>

            
           
      </div>
    </section>

      <script src="./js/script.js"></script>
    </section>
  </body>
</html>
